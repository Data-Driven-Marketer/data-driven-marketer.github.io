<style>
  :root{
    --paper:#F8F4EA;
    --paper-dim:#EFE8D8;
    --ink:#1B2A22;
    --ink-soft:#4B5A4F;
    --pine:#2F4B37;
    --pine-deep:#20331F;
    --rust:#B5502D;
    --rust-deep:#8F3D20;
    --gold:#C79A3B;
    --line:#D8CFB6;
    --radius:3px;
    --max:1120px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}

  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:560;
    margin:0 0 .4em;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(248,244,234,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:680;
    font-size:1.35rem;
    display:flex;align-items:center;gap:10px;
    text-decoration:none;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:50%;
    background:var(--pine);
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600;
  }
  .nav-links{display:flex;gap:28px;align-items:center;font-size:.95rem;}
  .nav-links a{text-decoration:none;color:var(--ink-soft);}
  .nav-links a:hover{color:var(--ink);}
  .cart-btn{
    position:relative;
    background:none;border:1px solid var(--ink);
    padding:8px 16px;border-radius:var(--radius);
    font:inherit;font-size:.9rem;cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .cart-count{
    background:var(--rust);color:#fff;
    border-radius:50%;width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:.7rem;
  }

  /* ---------- hero ---------- */
  .hero{
    padding:76px 0 64px;
    border-bottom:1px solid var(--line);
  }
  .hero-grid{
    display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;color:var(--pine);
    display:flex;align-items:center;gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--rust);}
  .hero h1{
    font-size:clamp(2.3rem,4.4vw,3.4rem);
    line-height:1.06;
    max-width:14ch;
  }
  .hero p{
    font-size:1.08rem;color:var(--ink-soft);
    max-width:46ch;margin:18px 0 30px;
  }
  .hero-ctas{display:flex;flex-wrap:wrap;gap:14px;}
  .btn{
    font:inherit;font-size:.95rem;font-weight:600;
    padding:13px 24px;border-radius:var(--radius);
    cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:9px;
    border:1px solid transparent;
    transition:transform .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--pine);color:var(--paper);}
  .btn-primary:hover{background:var(--pine-deep);}
  .btn-outline{background:transparent;border-color:var(--ink);color:var(--ink);}
  .btn-outline:hover{background:var(--ink);color:var(--paper);}
  .btn-rust{background:var(--rust);color:#fff;}
  .btn-rust:hover{background:var(--rust-deep);}
  .btn-wa{background:#25683f;color:#fff;}
  .btn-wa:hover{background:#1d5230;}

  .hero-visual{
    background:var(--pine);
    border-radius:var(--radius);
    aspect-ratio:4/5;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:26px;color:var(--paper);
    position:relative;overflow:hidden;
  }
  .hero-visual::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 78% 18%, rgba(199,154,59,.35), transparent 55%);
  }
  .hero-visual .tag{
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;
    letter-spacing:.02em;opacity:.85;position:relative;
  }
  .hero-visual .big{
    font-family:'Fraunces',serif;font-size:2.6rem;font-weight:500;
    line-height:1;position:relative;
  }

  /* ---------- section shell ---------- */
  section{padding:68px 0;border-bottom:1px solid var(--line);}
  .section-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:36px;gap:24px;flex-wrap:wrap;
  }
  .section-head h2{font-size:1.9rem;max-width:20ch;}
  .section-head p{color:var(--ink-soft);max-width:38ch;margin:0;}

  /* ---------- products ---------- */
  .products{
    display:grid;grid-template-columns:repeat(4,1fr);gap:22px;
  }
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
  }
